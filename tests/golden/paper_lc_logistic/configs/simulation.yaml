# The default run. Vehicle and driver values are the odca package defaults, which are this
# paper's Table of default parameters; an experiment overrides them with a Python replace().
network: network.yaml
demand: demand.yaml
hdv_vehicle: odca://hdv_vehicle.yaml
hdv_driver:
  _base_: odca://hdv_driver.yaml
  lane_change:
    dlc_requires_advantage: true   # DLC only toward a faster lane (odca-des:D-2026-10-02-1)
av_vehicle: odca://av_vehicle.yaml
av_driver:
  _base_: odca://av_driver.yaml
  lane_change:
    dlc_enabled: true              # this paper's AVs change lanes for speed (CONTEXT.md, AV parameters)
    dlc_requires_advantage: true
controller: odca://controller.yaml
av_penetration: 0.0
sim_duration: 3600.0    # s
warmup: 300.0           # s
seed: 42
