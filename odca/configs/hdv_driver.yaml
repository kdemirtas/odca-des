# Human driver population (dissertation calibration): tau, action_interval and
# slowdown_prob are means, *_std their spreads; times in s, distances in cells.
tau: 1.5
action_interval: 1.0
slowdown_prob: 0.15
slowdown_delta: 0.5
look_ahead: 10
look_behind: 10
lane_change:
  model: logistic
  safety_gap_front: 2.0
  safety_gap_rear: 2.0
  dlc_cooldown: 10.0
  dlc_enabled: true
  mlc_k: 8.0
  mlc_r0: 0.3
  dlc_k: 3.0
  dlc_v0: 1.0
lc_patience: 3.0
min_reeval_ratio: 0.5
blockage_scan_mult: 3
min_creep_speed: 0.1
slowdown_min_speed: 0.5
tau_std: 0.3
action_interval_std: 0.2
slowdown_prob_std: 0.05
tau_min: 0.5
tau_max: 3.0
action_interval_min: 0.3
action_interval_max: 3.0
